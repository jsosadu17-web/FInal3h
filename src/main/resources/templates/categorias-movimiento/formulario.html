<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Formulario Categoría</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5" style="max-width:700px;">
<nav class="mb-3">
    <a th:href="@{/inicio}" class="btn btn-outline-primary btn-sm">← Inicio</a>
</nav>
<div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
        <h4 class="mb-0" th:text="${titulo}">Registrar Categoría</h4>
    </div>
    <div class="card-body">
        <form th:action="@{/categorias-movimiento/guardar}" th:object="${categoriaMovimiento}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" id="nombre" th:field="*{nombre}" class="form-control" placeholder="Ej. Ventas al contado">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
            </div>

            <div class="mb-3">
                <label for="tipo" class="form-label">Tipo</label>
                <select id="tipo" th:field="*{tipo}" class="form-select">
                    <option value="">-- Seleccione tipo --</option>
                    <option value="INGRESO">Ingreso</option>
                    <option value="EGRESO">Egreso</option>
                </select>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>
            </div>

            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea id="descripcion" th:field="*{descripcion}" class="form-control" rows="3" placeholder="Detalle de la categoría"></textarea>
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" id="activo" th:field="*{activo}" class="form-check-input">
                <label for="activo" class="form-check-label">Activo</label>
            </div>

            <div class="d-flex justify-content-between pt-2">
                <a th:href="@{/categorias-movimiento}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-success">Guardar Categoría</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
