<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorías de Movimiento</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Categorías de Movimiento</h2>
    <div>
        <a th:href="@{/movimientos-caja}" class="btn btn-outline-secondary me-2">Ir a Movimientos</a>
        <a th:href="@{/categorias-movimiento/nuevo}" class="btn btn-primary">Nueva Categoría</a>
    </div>
</div>

<form th:action="@{/categorias-movimiento}" method="get" class="card card-body shadow-sm mb-3">
    <div class="row g-3 align-items-end">
        <div class="col-md-4">
            <label for="tipo" class="form-label">Tipo</label>
            <select id="tipo" name="tipo" class="form-select">
                <option value="" th:selected="${tipoSeleccionado == null || tipoSeleccionado == ''}">Todos</option>
                <option value="INGRESO" th:selected="${tipoSeleccionado == 'INGRESO'}">Ingreso</option>
                <option value="EGRESO" th:selected="${tipoSeleccionado == 'EGRESO'}">Egreso</option>
            </select>
        </div>
        <div class="col-md-8">
            <button type="submit" class="btn btn-success">Filtrar</button>
            <a th:href="@{/categorias-movimiento}" class="btn btn-outline-secondary ms-2">Limpiar</a>
        </div>
    </div>
</form>

<table class="table table-striped table-hover shadow-sm">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Tipo</th>
        <th>Descripción</th>
        <th>Estado</th>
        <th class="text-center">Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="cat : ${categorias}">
        <td th:text="${cat.id}">1</td>
        <td th:text="${cat.nombre}">Ventas al contado</td>
        <td>
            <span class="badge" th:classappend="${cat.tipo == 'INGRESO'} ? ' text-bg-success' : ' text-bg-danger'" th:text="${cat.tipo}">INGRESO</span>
        </td>
        <td th:text="${cat.descripcion}">Descripción</td>
        <td th:text="${cat.activo != null && cat.activo ? 'Activo' : 'Inactivo'}">Activo</td>
        <td class="text-center">
            <a th:href="@{/categorias-movimiento/editar/{id}(id=${cat.id})}" class="btn btn-warning btn-sm">Editar</a>
            <a th:href="@{/categorias-movimiento/eliminar/{id}(id=${cat.id})}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('¿Está seguro de eliminar esta categoría?');">Eliminar</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(categorias)}">
        <td colspan="6" class="text-center text-muted">No hay categorías registradas</td>
    </tr>
    </tbody>
</table>
</body>
</html>
