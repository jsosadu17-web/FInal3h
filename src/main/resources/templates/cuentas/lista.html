<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Cuentas de Caja</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<nav class="mb-3">
    <a th:href="@{/inicio}" class="btn btn-outline-primary btn-sm">← Inicio</a>
</nav>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Listado de Cuentas de Caja</h2>
        <div>
            <a th:href="@{/empresas}" class="btn btn-outline-secondary me-2">Ir a Empresas</a>
            <a th:href="@{/movimientos-caja}" class="btn btn-outline-secondary me-2">Movimientos</a>
            <a th:href="@{/cuentas/nuevo}" class="btn btn-primary">Nueva Cuenta</a>
        </div>
    </div>
        <!-- Indicador opcional de filtro por empresa -->
        <div th:if="${empresaSeleccionada != null}" class="alert alert-info py-2">
            Filtrando por empresa<strong th:text="${empresaSeleccionada.razonSocial}">Empresa</strong>
            <a th:href="@{/cuentas}" class="float-end text-decoration-none">Mostrar todas</a>
        </div>
        <table class="table table-striped table-hover shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Numero de Cuenta</th>
                    <th>Nombre de Caja</th>
                    <th>Saldo</th>
                    <th>Empresa</th>
                    <th class="text-center">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cta:${cuentas}">
                    <td th:text="${cta.id}">1</td>
                    <td th:text="${cta.numeroCuenta}">191-1234567-0-01</td>
                    <td th:text="${cta.nombreCuenta}">Caja Principal</td>
                    <td th:text="${'S/' + #numbers.formatDecimal(cta.saldo,1,'POINT',2,'COMMA')}">1500.00</td>
                    <!-- Muestra la razón social de la empresa asociada -->
                    <td th:text="${cta.empresa != null ? cta.empresa.razonSocial : 'Sin Empresa'}">Empresa SAC</td>
                    <td class="text-center">
                        <a th:href="@{/cuentas/editar/{id}(id=${cta.id})}" class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/cuentas/eliminar/{id}(id=${cta.id})}" class="btn btn-danger btn-sm"
                        onclick="return confirm('Estas seguro de eliminar esta cuenta?')">Eliminar</a>
                    </td>

                </tr>
            </tbody>
        </table>


</body>
</html>
