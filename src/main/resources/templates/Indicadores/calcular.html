<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${titulo}">Calcular Indicador</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 800px;">
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">Cálculo e Indicadores de Liquidez</h4>
    </div>
    <div class="card-body">
      <form th:action="@{/indicadores/calcular}" method="post">
        <div class="mb-3">
          <label for="empresaId" class="form-label fw-bold">Empresa</label>
          <select id="empresaId" name="empresaId" class="form-select" required>
            <option value="">-- Seleccione una Empresa --</option>
            <option th:each="emp : ${empresas}"
                    th:value="${emp.id}"
                    th:text="${emp.razonSocial}"
                    th:selected="${emp.id == empresaId}">Empresa</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="periodo" class="form-label fw-bold">Periodo (Año-Mes)</label>
          <input type="month" id="periodo" name="periodo" class="form-control"
                 th:value="${periodo}" required>
        </div>

        <div class="d-flex justify-content-between pt-2">
          <a th:href="@{/indicadores/dashboard/1}" class="btn btn-secondary">Ir al Dashboard</a>
          <button type="submit" class="btn btn-success">Calcular y Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Tarjeta de Resultados -->
  <div class="card shadow-sm border-success" th:if="${resultado != null}">
    <div class="card-header bg-success text-white">
      <h5 class="mb-0">Resultado del Cálculo</h5>
    </div>
    <div class="card-body">
      <div class="row text-center">
        <div class="col-md-3">
          <small class="text-muted">Capital de Trabajo</small>
          <h5 class="fw-bold mt-1" th:text="${'S/ ' + resultado.capitalTrabajo}">S/ 0.00</h5>
        </div>
        <div class="col-md-3">
          <small class="text-muted">Razón Corriente</small>
          <h5 class="fw-bold mt-1" th:text="${resultado.razonCorriente}">0.00</h5>
        </div>
        <div class="col-md-3">
          <small class="text-muted">Días de Caja</small>
          <h5 class="fw-bold mt-1" th:text="${resultado.diasCajaDisponible + ' días'}">0 días</h5>
        </div>
        <div class="col-md-3">
          <small class="text-muted">Nivel de Riesgo</small>
          <h5 class="fw-bold mt-1">
                        <span class="badge"
                              th:classappend="${resultado.nivelRiesgo == 'BAJO' ? 'bg-success' : (resultado.nivelRiesgo == 'MEDIO' ? 'bg-warning text-dark' : 'bg-danger')}"
                              th:text="${resultado.nivelRiesgo}">NIVEL</span>
          </h5>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
