<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Movimientos de Caja</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<nav class="mb-3">
    <a th:href="@{/inicio}" class="btn btn-outline-primary btn-sm">← Inicio</a>
</nav>
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Historial de Movimientos de Caja</h2>
    <div>
        <a th:href="@{/categorias-movimiento}" class="btn btn-outline-secondary me-2">Categorías</a>
        <a th:href="@{/movimientos-caja/nuevo}" class="btn btn-primary">Nuevo Movimiento</a>
    </div>
</div>

<div class="alert alert-danger" th:if="${error != null}" th:text="${error}"></div>

<form th:action="@{/movimientos-caja}" method="get" class="card card-body shadow-sm mb-3">
    <div class="row g-3 align-items-end">
        <div class="col-md-2">
            <label for="fechaInicio" class="form-label">Desde</label>
            <input type="date" id="fechaInicio" name="fechaInicio" th:value="${fechaInicio}" class="form-control">
        </div>
        <div class="col-md-2">
            <label for="fechaFin" class="form-label">Hasta</label>
            <input type="date" id="fechaFin" name="fechaFin" th:value="${fechaFin}" class="form-control">
        </div>
        <div class="col-md-2">
            <label for="tipo" class="form-label">Tipo</label>
            <select id="tipo" name="tipo" class="form-select">
                <option value="" th:selected="${tipoSeleccionado == null || tipoSeleccionado == ''}">Todos</option>
                <option value="INGRESO" th:selected="${tipoSeleccionado == 'INGRESO'}">Ingreso</option>
                <option value="EGRESO" th:selected="${tipoSeleccionado == 'EGRESO'}">Egreso</option>
            </select>
        </div>
        <div class="col-md-3">
            <label for="cuentaCajaId" class="form-label">Cuenta</label>
            <select id="cuentaCajaId" name="cuentaCajaId" class="form-select">
                <option value="" th:selected="${cuentaSeleccionada == null}">Todas</option>
                <option th:each="cta : ${cuentas}"
                        th:value="${cta.id}"
                        th:selected="${cuentaSeleccionada != null && cuentaSeleccionada == cta.id}"
                        th:text="${cta.nombreCuenta}">Cuenta</option>
            </select>
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn btn-success">Filtrar</button>
            <a th:href="@{/movimientos-caja}" class="btn btn-outline-secondary ms-2">Limpiar</a>
        </div>
    </div>
</form>

<table class="table table-striped table-hover shadow-sm">
    <thead class="table-dark">
    <tr>
        <th>Fecha</th>
        <th>Tipo</th>
        <th>Categoría</th>
        <th>Cuenta</th>
        <th>Descripción</th>
        <th class="text-end">Monto</th>
        <th class="text-center">Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="mov : ${movimientos}">
        <td th:text="${#temporals.format(mov.fechaMovimiento, 'dd/MM/yyyy HH:mm')}">01/07/2026 09:15</td>
        <td>
            <span class="badge" th:classappend="${mov.tipo == 'INGRESO'} ? ' text-bg-success' : ' text-bg-danger'" th:text="${mov.tipo}">INGRESO</span>
        </td>
        <td th:text="${mov.nombreCategoria}">Ventas</td>
        <td th:text="${mov.nombreCuenta}">Caja Principal</td>
        <td th:text="${mov.descripcion}">Detalle</td>
        <td class="text-end" th:text="${'S/ ' + #numbers.formatDecimal(mov.monto, 1, 'POINT', 2, 'COMMA')}">S/ 0.00</td>
        <td class="text-center">
            <a th:href="@{/movimientos-caja/editar/{id}(id=${mov.id})}" class="btn btn-warning btn-sm">Editar</a>
            <a th:href="@{/movimientos-caja/eliminar/{id}(id=${mov.id})}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('¿Está seguro de eliminar este movimiento?');">Eliminar</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(movimientos)}">
        <td colspan="7" class="text-center text-muted">No hay movimientos registrados</td>
    </tr>
    </tbody>
</table>
</body>
</html>
