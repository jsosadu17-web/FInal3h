<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Formulario Empresa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5" style="max-width:600px;">
<nav class="mb-3">
    <a th:href="@{/inicio}" class="btn btn-outline-primary btn-sm">← Inicio</a>
</nav>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0" th:text="${titulo}">Registrar Empresa</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/empresas/guardar}" th:object="${empresa}" method="post">

                <!-- Campo oculto para conservar el ID en las ediciones -->
                <input type="hidden" th:field="*{id}" />
                <div class="mb-3">
                    <label for="ruc" class="form-label">RUC</label>
                    <input type="text" id="ruc" th:field="*{ruc}" class="form-control" placeholder="Ingrese los 11 digitos del RUC" />
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('ruc')}" th:errors="*{ruc}"></div>
                </div>
                <div class="mb-3">
                    <label for="razonSocial" class="form-label">Razon Social</label>
                    <input type="text" id="razonSocial" th:field="*{razonSocial}" class="form-control" placeholder="Nombre o Razon Social"/>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('razonSocial')}" th:errors="*{razonSocial}"></div>
                </div>
                <div class="mb-3">
                    <label for="direccion" class="form-label">Direccion</label>
                    <input type="text" id="direccion" th:field="*{direccion}" class="form-control" placeholder="Direccion Fiscal"/>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></div>
                </div>
                <div class="mb-3">
                    <label for="telefono" class="form-label">Telefono</label>
                    <input type="text" id="telefono" th:field="*{telefono}" class="form-control" placeholder="Numero de contacto"/>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                </div>
                <div class="d-flex justify-content-between pt-2">
                    <a th:href="@{/empresas}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Guardar Empresa</button>
                </div>
            </form>
        </div>

    </div>
</body>
</html>
