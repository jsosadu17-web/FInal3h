<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Empresas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Listado de Empresas</h2>
        <div>
            <a th:href="@{/cuentas}" class="btn btn-outline-secondary me-2">Cuentas</a>
            <a th:href="@{/movimientos-caja}" class="btn btn-outline-secondary me-2">Movimientos</a>
            <a th:href="@{/empresas/nuevo}" class="btn btn-primary">Nueva Empresa</a>
        </div>
    </div>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>RUC</th>
                <th>Razon Social</th>
                <th>Direccion</th>
                <th>Telefono</th>
                <th class="text-center">Acciones</th>
            </tr>
        </thead>
       <tbody>
            <tr th:each="emp:${empresas}">
                <td th:text="${emp.id}">1</td>
                <td th:text="${emp.ruc}">20123456789</td>
                <td th:text="${emp.razonSocial}">Empresa SAC</td>
                <td th:text="${emp.direccion}">Av. Principal 123</td>
                <td th:text="${emp.telefono}">987654321</td>
                <td class="text-center">
                    <a th:href="@{/empresas/editar/{id}(id=${emp.id})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/empresas/eliminar/{id}(id=${emp.id})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Estás seguro de eliminar esta empresa?');">Eliminar</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(empresas)}">
                <td colspan="6" class="text-center text-muted">No hay empresas registradas</td>
            </tr>
       </tbody>
    </table>

</body>
</html>
