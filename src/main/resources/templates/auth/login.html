<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Sistema Caja</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-5">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="/login">Sistema de Caja</a>
        <a class="btn btn-outline-light btn-sm" href="/registro">Crear cuenta</a>
    </div>
</nav>

<main class="container" style="max-width: 520px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-2 text-center">Bienvenido</h1>
            <p class="text-muted text-center mb-4">Inicia sesión para entrar al panel principal del proyecto.</p>

            <div id="mensaje" class="alert d-none" role="alert"></div>

            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" id="username" class="form-control" autocomplete="username" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </form>

            <p class="text-center mt-4 mb-0">
                ¿No tienes usuario? <a href="/registro">Regístrate aquí</a>
            </p>
        </div>
    </div>
</main>

<script>
    const form = document.getElementById('loginForm');
    const mensaje = document.getElementById('mensaje');

    function mostrarMensaje(tipo, texto) {
        mensaje.className = `alert alert-${tipo}`;
        mensaje.textContent = texto;
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
            mostrarMensaje('warning', 'Completa usuario y contraseña.');
            return;
        }

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await response.json();

            if (!response.ok) {
                mostrarMensaje('danger', data.message || 'Usuario o contraseña incorrectos.');
                return;
            }

            localStorage.setItem('sc_token', data.token);
            localStorage.setItem('sc_username', data.username);
            localStorage.setItem('sc_rol', data.rol);
            window.location.href = '/inicio';
        } catch (error) {
            mostrarMensaje('danger', `No se pudo conectar con el servidor: ${error.message}`);
        }
    });
</script>
</body>
</html>
