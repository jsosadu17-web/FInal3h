<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro | Sistema Caja</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-5">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="/login">Sistema de Caja</a>
        <a class="btn btn-outline-light btn-sm" href="/login">Iniciar sesión</a>
    </div>
</nav>

<main class="container" style="max-width: 560px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-2 text-center">Crear cuenta</h1>
            <p class="text-muted text-center mb-4">Registra un usuario para acceder al panel de navegación.</p>

            <div id="mensaje" class="alert d-none" role="alert"></div>

            <form id="registroForm" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" id="username" class="form-control" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control" autocomplete="new-password" required>
                </div>
                <div class="mb-4">
                    <label for="idRol" class="form-label">Rol</label>
                    <select id="idRol" class="form-select" required>
                        <option value="1" selected>Administrador</option>
                        <option value="2">Usuario</option>
                    </select>
                    <div class="form-text">Selecciona el ID de rol que exista en la base de datos del proyecto.</div>
                </div>
                <button type="submit" class="btn btn-success w-100">Registrarme</button>
            </form>

            <p class="text-center mt-4 mb-0">
                ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
            </p>
        </div>
    </div>
</main>

<script>
    const form = document.getElementById('registroForm');
    const mensaje = document.getElementById('mensaje');

    function mostrarMensaje(tipo, texto) {
        mensaje.className = `alert alert-${tipo}`;
        mensaje.textContent = texto;
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const idRol = Number(document.getElementById('idRol').value);

        if (!username || !password || !idRol) {
            mostrarMensaje('warning', 'Completa todos los campos.');
            return;
        }

        try {
            const response = await fetch('/api/auth/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, idRol })
            });

            if (!response.ok) {
                let detalle = 'No se pudo registrar el usuario.';
                try {
                    const data = await response.json();
                    detalle = data.message || detalle;
                } catch (ignored) {
                    detalle = await response.text() || detalle;
                }
                mostrarMensaje('danger', detalle);
                return;
            }

            mostrarMensaje('success', 'Usuario registrado. Redirigiendo al login...');
            setTimeout(() => window.location.href = '/login', 1200);
        } catch (error) {
            mostrarMensaje('danger', `No se pudo conectar con el servidor: ${error.message}`);
        }
    });
</script>
</body>
</html>
